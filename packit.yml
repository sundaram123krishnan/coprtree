# See the documentation for more information:
# https://packit.dev/docs/configuration/

specfile_path: ./coprtree/python-coprtree.spec

srpm_build_deps:
  - python3-build
  - python3-hatchling

actions:
  create-archive:
    - bash -c "python3 -m build --sdist --no-isolation --outdir . ./coprtree"
    - bash -c "ls -1t ./*.tar.gz | head -n 1"
  get-current-version: "sed -n 's/^version = \"\\(.*\\)\\\"/\\1/p' coprtree/pyproject.toml"

jobs:
  - job: copr_build
    trigger: pull_request
    manual_trigger: true
    targets: [fedora-all]

  - job: tests
    trigger: pull_request
    manual_trigger: true
    targets: [fedora-all]

  - job: propose_downstream
    trigger: release
    dist_git_branches:
      - fedora-all


# add or remove files that should be synced
files_to_sync:
    - ./coprtree/python-coprtree.spec
    - src: packit.yml
      dest: .packit.yml

# name in upstream package repository/registry (e.g. in PyPI)
upstream_package_name: coprtree
# downstream (Fedora) RPM package name
downstream_package_name: python-coprtree
